<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1a2438">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ninja em Ação">
<title>Ninja em Ação!</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
  :root { --bg:#0b0e22; --btn:#ffffffd9; --btnOn:#ffd34a; --ink:#1a2438; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; height:100%; background:var(--bg); overflow:hidden; touch-action:none;
    -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  #wrap { position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  canvas { display:block; background:#000; border-radius:8px; image-rendering:auto; }
  .pad { position:fixed; bottom:calc(14px + env(safe-area-inset-bottom)); display:flex; gap:12px; z-index:5; }
  #padL { left:calc(14px + env(safe-area-inset-left)); }
  #padR { right:calc(14px + env(safe-area-inset-right)); }
  .b { width:72px; height:72px; border-radius:50%; border:3px solid var(--ink); background:var(--btn);
    font-size:30px; font-weight:800; color:var(--ink); display:flex; align-items:center; justify-content:center;
    box-shadow:0 4px 0 #0006; opacity:.85; }
  .b.on { background:var(--btnOn); transform:translateY(3px); box-shadow:0 1px 0 #0006; }
  #bJump { width:88px; height:88px; font-size:16px; }
  #mute { position:fixed; top:calc(8px + env(safe-area-inset-top)); right:calc(8px + env(safe-area-inset-right));
    z-index:6; width:40px; height:40px; border-radius:50%; border:2px solid var(--ink); background:var(--btn); font-size:18px; }
  body.nokeys .pad { display:flex; }
  @media (hover:hover) and (pointer:fine) { .pad { display:none; } }
  @media (orientation:portrait) { .pad { bottom:calc(40px + env(safe-area-inset-bottom)); } }
  /* Modo "página" (usado no link): o jogo ocupa espaço de verdade e os botões ficam embaixo. */
  html.flow, html.flow body { height:auto; overflow:visible; }
  html.flow #wrap { position:static; padding:8px max(8px, env(safe-area-inset-right, 0px)) 0 max(8px, env(safe-area-inset-left, 0px)); }
  html.flow .pad, html.flow #mute { position:static; }
  html.flow #controls { display:flex; justify-content:space-between; align-items:center; gap:8px; max-width:960px; margin:0 auto;
    padding:10px max(12px, env(safe-area-inset-right, 0px)) 14px max(12px, env(safe-area-inset-left, 0px)); }
  html.flow .b { width:60px; height:60px; font-size:26px; }
  html.flow #bJump { width:74px; height:74px; font-size:14px; }
</style>
</head>
<body>
<div id="wrap"><canvas id="c" width="480" height="360" aria-label="Jogo Ninja em Ação"></canvas></div>
<div id="controls">
<div class="pad" id="padL">
  <button class="b" id="bLeft" aria-label="Voltar">◀</button>
  <button class="b" id="bRight" aria-label="Correr">▶</button>
</div>
<button id="mute" aria-label="Som ligado ou desligado">🔊</button>
<div class="pad" id="padR">
  <button class="b" id="bDown" aria-label="Abaixar">▼</button>
  <button class="b" id="bJump" aria-label="Pular">PULAR</button>
</div>
</div>

<script>
/* Ninja em Ação! — Jogo 1
   Personagens e cenários desenhados pelo criador do jogo.
   Coordenadas iguais às do Scratch: centro (0,0), x de -240 a 240, y de -180 a 180. */
(() => {
'use strict';

// ---------- Configuração ----------
const params = new URLSearchParams(location.search);
const PHASE_SECONDS = params.has('teste') ? 3 : 20;   // ?teste deixa cada fase com 3 segundos
const FPS = 30;
const W = 480, H = 360;
const PHASE_NAMES = ['Escola', 'Pátio', 'Telhados', 'Trem', 'Museu'];
const LOW = ['bola','mochila','balde','espinhos','pedra','caixa','antena','placa','cone','ossos','armadura'];
const TALL = ['antena','placa','armadura'];
const BY_PHASE = [['bola','mochila','balde'], ['espinhos','pedra'], ['caixa','antena'], ['placa','cone'], ['ossos','armadura']];
const FLYERS = ['pombo-voador','morcego-voador'];

// ---------- Imagens ----------
const IMG = {};
const files = ['1-escola','2-patio','3-telhados','4-trem','5-museu','6-festa',
  'dead-power-1-parado','dead-power-2-pulando','dead-power-3-abaixado','cinzento','mao-afiada-1','mao-afiada-2',
  ...LOW, ...FLYERS, 'bomba','explosao','estrelinha','coracao-vida',
  'confete-amarelo','confete-azul','confete-verde','confete-vermelho',
  'nome-fase-1','nome-fase-2','nome-fase-3','nome-fase-4','nome-fase-5',
  'tela-game-over','tela-parabens','titulo-ninja-em-acao',
  'botao-jogar-de-novo','botao-nao-jogar-de-novo','botao-sim-ir-pro-jogo-2'];
let loaded = 0;
for (const f of files) {
  const im = new Image();
  im.onload = im.onerror = () => { loaded++; };
  im.src = window.__IMG[f];
  IMG[f] = im;
}
const iw = n => IMG[n].naturalWidth || 40, ih = n => IMG[n].naturalHeight || 40;

// ---------- Tela ----------
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let scale = 1;
let lastSize = '';
function resize() {
  const flow = document.documentElement.classList.contains('flow');
  let vw, vh;
  if (flow) {
    // no link: largura do espaço disponível; altura limitada pela tela só quando ela é confiável
    vw = Math.min(document.getElementById('wrap').clientWidth - 16, 960);
    // altura: usa o tamanho da TELA do aparelho (nunca o da janela, que no iPhone muda junto com a página)
    const sw = window.screen.width || 390, sh = window.screen.height || 844;
    const deitado = (screen.orientation && String(screen.orientation.type).indexOf('landscape') === 0) || Math.abs(window.orientation || 0) === 90;
    vh = Math.max(200, (deitado ? Math.min(sw, sh) : Math.max(sw, sh)) - 150);
  } else { vw = window.innerWidth; vh = window.innerHeight; }
  if (!(vw > 50)) vw = 480; if (!(vh > 50)) vh = 360;
  const s = Math.max(0.4, Math.min(vw / W, vh / H));
  const key = vw + 'x' + vh;
  if (key === lastSize) return; lastSize = key;
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  cv.style.width = Math.floor(W * s) + 'px';
  cv.style.height = Math.floor(H * s) + 'px';
  cv.width = Math.floor(W * s * dpr); cv.height = Math.floor(H * s * dpr);
  scale = s * dpr;
}
window.addEventListener('resize', resize); window.addEventListener('orientationchange', () => setTimeout(resize, 300));
if (window.ResizeObserver) new ResizeObserver(resize).observe(document.getElementById('wrap'));
setInterval(resize, 700);   // segurança: alguns celulares avisam a mudança de tamanho atrasado
resize();

// desenha uma imagem com o centro em (x,y) no sistema do Scratch
function draw(name, x, y, opts = {}) {
  const im = IMG[name]; if (!im || !im.complete || !im.naturalWidth) return;
  const s = opts.size == null ? 1 : opts.size;
  const w = iw(name) * s, h = ih(name) * s;
  ctx.save();
  ctx.globalAlpha = opts.alpha == null ? 1 : opts.alpha;
  ctx.translate(240 + x, 180 - y);
  if (opts.rot) ctx.rotate(opts.rot * Math.PI / 180);
  ctx.drawImage(im, -w / 2, -h / 2, w, h);
  ctx.restore();
}
function text(t, x, y, size, color, opts = {}) {
  ctx.save();
  ctx.font = `${opts.weight || 800} ${size}px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif`;
  ctx.textAlign = opts.align || 'center'; ctx.textBaseline = 'middle';
  if (opts.stroke) { ctx.lineWidth = opts.strokeW || 4; ctx.strokeStyle = opts.stroke; ctx.strokeText(t, 240 + x, 180 - y); }
  ctx.fillStyle = color; ctx.fillText(t, 240 + x, 180 - y);
  ctx.restore();
}
function roundRect(x, y, w, h, r, fill, stroke) {
  const X = 240 + x - w / 2, Y = 180 - y - h / 2;
  ctx.beginPath(); ctx.moveTo(X + r, Y); ctx.arcTo(X + w, Y, X + w, Y + h, r); ctx.arcTo(X + w, Y + h, X, Y + h, r);
  ctx.arcTo(X, Y + h, X, Y, r); ctx.arcTo(X, Y, X + w, Y, r); ctx.closePath();
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.lineWidth = 3; ctx.strokeStyle = stroke; ctx.stroke(); }
}
function bubble(t, x, y) {
  ctx.save(); ctx.font = '700 13px system-ui, sans-serif';
  const w = Math.min(220, ctx.measureText(t).width + 20); ctx.restore();
  let bx = Math.max(-240 + w / 2 + 4, Math.min(240 - w / 2 - 4, x));
  roundRect(bx, y, w, 30, 12, '#fff', '#555');
  ctx.beginPath(); ctx.moveTo(240 + x - 6, 180 - y + 14); ctx.lineTo(240 + x + 6, 180 - y + 14); ctx.lineTo(240 + x, 180 - y + 24);
  ctx.closePath(); ctx.fillStyle = '#fff'; ctx.fill();
  text(t, bx, y, 13, '#222', { weight: 700 });
}

// ---------- Som (feito no próprio aparelho, sem arquivos) ----------
let AC = null, master = null, muted = false;
function audio() {
  if (!AC) {
    const A = window.AudioContext || window.webkitAudioContext; if (!A) return null;
    AC = new A(); master = AC.createGain(); master.gain.value = muted ? 0 : 0.5; master.connect(AC.destination);
  }
  if (AC.state === 'suspended') AC.resume();
  return AC;
}
function tone(freq, dur, type = 'square', vol = 0.15, when = 0, slideTo = null) {
  const a = audio(); if (!a) return;
  const t = a.currentTime + when;
  const o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.02);
}
function noise(dur, vol = 0.4) {
  const a = audio(); if (!a) return;
  const len = Math.floor(a.sampleRate * dur), buf = a.createBuffer(1, len, a.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
  const s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
  f.type = 'lowpass'; f.frequency.value = 900; g.gain.value = vol;
  s.buffer = buf; s.connect(f); f.connect(g); g.connect(master); s.start();
}
const SFX = {
  jump: () => tone(300, 0.18, 'square', 0.12, 0, 700),
  hit: () => { tone(140, 0.25, 'square', 0.2, 0, 60); noise(0.12, 0.25); },
  pop: () => tone(600, 0.08, 'sine', 0.2, 0, 900),
  boom: () => { noise(1.2, 0.7); tone(90, 0.8, 'sawtooth', 0.2, 0, 30); },
  win: () => [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.25, 'square', 0.12, i * 0.12)),
  lose: () => [392, 330, 262, 196].forEach((f, i) => tone(f, 0.3, 'triangle', 0.18, i * 0.2)),
  phase: () => [659, 784].forEach((f, i) => tone(f, 0.15, 'square', 0.1, i * 0.1)),
  life: () => [784, 988, 1319].forEach((f, i) => tone(f, 0.14, 'sine', 0.16, i * 0.07)),
};
// música: uma melodia curta diferente para cada fase
const SONGS = [
  [262, 330, 392, 330, 294, 349, 440, 349],
  [392, 440, 494, 440, 392, 330, 294, 330],
  [220, 262, 330, 262, 247, 294, 370, 294],
  [330, 330, 392, 330, 440, 392, 330, 294],
  [196, 233, 294, 233, 185, 220, 277, 220],
  [523, 659, 784, 659, 587, 698, 880, 698],
];
let song = -1, songStep = 0, songTimer = 0;
function musicTick(dt) {
  if (song < 0 || !AC) return;
  songTimer -= dt;
  if (songTimer <= 0) {
    const notes = SONGS[song];
    const f = notes[songStep % notes.length];
    tone(f, 0.18, 'triangle', 0.07); if (songStep % 2 === 0) tone(f / 2, 0.2, 'square', 0.03);
    songStep++; songTimer = song === 5 ? 0.16 : 0.22;
  }
}

// ---------- Controles ----------
const keys = { left: false, right: false, down: false, jump: false };
let jumpPressed = false;
function titleKey(k, code) {
  if (k === 'left') modo = (modo + 2) % 3;
  else if (k === 'right') modo = (modo + 1) % 3;
  else if (k === 'jump') startGame(modo);
}
const KEYMAP = { ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right', ArrowDown: 'down', KeyS: 'down',
  Space: 'jump', ArrowUp: 'jump', KeyW: 'jump', Enter: 'jump' };
window.addEventListener('keydown', e => {
  const k = KEYMAP[e.code]; if (!k) return; e.preventDefault(); audio();
  if (k === 'jump' && !keys.jump) jumpPressed = true; keys[k] = true;
  if (state === 'title') titleKey(k, e.code);
});
['touchend','click'].forEach(ev => window.addEventListener(ev, () => audio(), { passive: true }));
window.addEventListener('keyup', e => { const k = KEYMAP[e.code]; if (k) keys[k] = false; });
function bindBtn(id, k) {
  const b = document.getElementById(id);
  const on = e => { e.preventDefault(); audio(); if (k === 'jump' && !keys.jump) jumpPressed = true; keys[k] = true; b.classList.add('on');
    if (state === 'title') titleKey(k); };
  const off = e => { e.preventDefault(); keys[k] = false; b.classList.remove('on'); };
  b.addEventListener('pointerdown', on); b.addEventListener('pointerup', off);
  b.addEventListener('pointercancel', off); b.addEventListener('pointerleave', off);
  b.addEventListener('contextmenu', e => e.preventDefault());
}
bindBtn('bLeft', 'left'); bindBtn('bRight', 'right'); bindBtn('bDown', 'down'); bindBtn('bJump', 'jump');
const muteBtn = document.getElementById('mute');
muteBtn.addEventListener('click', () => { muted = !muted; muteBtn.textContent = muted ? '🔇' : '🔊'; if (master) master.gain.value = muted ? 0 : 0.5; });

// cliques/toques na tela do jogo (botões desenhados)
const clickables = [];
cv.addEventListener('pointerdown', e => {
  audio();
  const r = cv.getBoundingClientRect();
  const x = (e.clientX - r.left) / r.width * W - 240, y = 180 - (e.clientY - r.top) / r.height * H;
  for (const c of clickables) if (Math.abs(x - c.x) < c.w / 2 && Math.abs(y - c.y) < c.h / 2) { SFX.pop(); c.fn(); return; }
});

// ---------- Rotinas (como os scripts do Scratch) ----------
let routines = [];
function run(gen) { const it = gen(); routines.push(it); return it; }
function* wait(sec) { let f = Math.round(sec * FPS); while (f-- > 0) yield; }
function* glide(o, x, y, sec) {
  const x0 = o.x, y0 = o.y, n = Math.max(1, Math.round(sec * FPS));
  for (let i = 1; i <= n; i++) { o.x = x0 + (x - x0) * i / n; o.y = y0 + (y - y0) * i / n; yield; }
}

// ---------- Estado ----------
let state = 'title';       // title, intro, play, cutscene, gameover, final
let fase = 1, vidas = 3, tempo = 0, timer = 0, frame = 0, clock = 0;
let showLogo = 0, phaseBanner = 0, jogo2 = false;
const dp = { x: -170, y: -60, cost: 'dead-power-1-parado', jumpF: -1, blink: 0, dance: false };
const cz = { x: 170, y: -63, show: false, size: 1, say: '', sayT: 0, bob: 0 };
const ma = { x: 200, y: -40, show: false, rot: 0, f: 0 };
const ob = { show: false, x: 260, y: -92, name: 'bola', t: 0, dur: 2, wait: 0.5 };
const fl = { show: false, x: 260, y: -22, name: 'pombo-voador', t: 0, dur: 3, wait: 3 };
const bomb = { show: false, x: 0, y: 0, name: 'bomba', size: 1 };
const hp = { show: false, x: 260, y: -80, t: 0, dur: 3, at: 10, done: false, pop: 0, popX: 0, popY: 0 };   // coração que dá vida
let stars = [], confetti = [];
// Modos de dificuldade
const MODES = [
  { nome: 'Fácil',   cor: '#2ea44f', vidas: 3, veloc: 1.35, espera: [0.35, 0.9],  voador: [1, 2.5],   coracoes: 1 },
  { nome: 'Médio',   cor: '#d4a017', vidas: 3, veloc: 1.65, espera: [0.25, 0.7],  voador: [0.8, 2],   coracoes: 1 },
  { nome: 'Difícil', cor: '#d63a2f', vidas: 2, veloc: 1.95, espera: [0.15, 0.55], voador: [0.6, 1.5], coracoes: 1 },
];
let modo = 1;
try { const g = localStorage.getItem('ninja-modo'); if (g === '0' || g === '1' || g === '2') modo = +g; } catch (e) {}
const M = () => MODES[modo];
const rnd = (a) => a[0] + Math.random() * (a[1] - a[0]);
const vel = () => (2.2 - 0.25 * fase) / M().veloc;   // segundos para atravessar a tela

function resetAll() {
  routines = []; stars = []; confetti = []; clickables.length = 0;
  fase = 1; vidas = M().vidas; tempo = 0; jogo2 = false;
  Object.assign(dp, { x: -170, y: -60, cost: 'dead-power-1-parado', jumpF: -1, blink: 0, dance: false });
  cz.show = false; ma.show = false; ob.show = false; fl.show = false; bomb.show = false; hp.show = false; hp.pop = 0;
}
function startGame(m) {
  if (m != null) { modo = m; try { localStorage.setItem('ninja-modo', String(m)); } catch (e) {} }
  resetAll(); showLogo = 2; startPhase();
}
function goTitle() { resetAll(); state = 'title'; song = -1; titleButtons(); }
function titleButtons() {
  clickables.length = 0;
  MODES.forEach((md, i) => clickables.push({ x: -130 + i * 130, y: -30, w: 116, h: 46, fn: () => startGame(i) }));
}
titleButtons();

function startPhase() {
  state = 'intro'; tempo = 0; timer = 0; phaseBanner = 2; SFX.phase();
  ob.show = false; ob.wait = 0.3; fl.show = false; fl.wait = rnd(M().voador);
  hp.show = false; hp.left = M().coracoes; hp.at = 4 + Math.random() * (M().coracoes > 1 ? 4 : 9);
  cz.show = fase >= 4; cz.x = -95; cz.y = -63; cz.size = 1; cz.say = '';
  ma.show = fase >= 4; ma.x = 200; ma.y = -40; ma.rot = 0;
  song = fase - 1; songStep = 0;
}

function hit() {
  vidas--; SFX.hit();
  ob.show = false; ob.wait = 1; fl.show = false; fl.wait = 1.5;
  if (vidas <= 0) { gameOver(); return; }
  dp.blink = 0.8;
}
function gameOver() {
  state = 'gameover'; song = -1; SFX.lose(); clickables.length = 0;
  ob.show = fl.show = false;
  clickables.push({ x: 0, y: -70, w: 240, h: 56, fn: () => startGame() });
}

function endPhase() {
  state = 'cutscene'; ob.show = false; fl.show = false; hp.show = false; song = -1;
  dp.jumpF = -1; dp.y = -60; dp.cost = 'dead-power-1-parado';
  run(function* () {
    if (fase <= 3) {
      cz.show = true; cz.x = 170; cz.y = -63; cz.size = 1;
      const lines = ['Eu protejo o pergaminho!', 'O Mão Afiada não vai pegar ele!', 'Me segue, Dead Power!'];
      cz.say = lines[fase - 1]; yield* wait(2); cz.say = '';
      if (fase === 1) yield* glide(cz, 170, 220, 0.8);                       // sobe pela janela
      if (fase === 2) for (let i = 0; i < 20; i++) { cz.y += 12; yield; }    // sobe correndo
      if (fase === 3) for (let i = 0; i < 20; i++) { cz.size -= 0.045; cz.y += 4; cz.x -= 2; yield; } // fica minúsculo
      cz.show = false; cz.size = 1;
    } else if (fase === 4) {
      cz.say = 'Estamos quase lá!'; yield* wait(1.5); cz.say = '';
    } else {
      cz.say = 'Toma essa, Mão Afiada!'; yield* wait(1.5); cz.say = '';
      Object.assign(bomb, { show: true, x: cz.x, y: cz.y, name: 'bomba', size: 1 });
      yield* glide(bomb, ma.x, ma.y, 0.8);
      SFX.boom(); bomb.name = 'explosao'; bomb.size = 0.6;
      for (let i = 0; i < 5; i++) { bomb.size += 0.2; yield; }
      yield* wait(0.2); bomb.show = false;
      for (let i = 0; i < 30; i++) {                                            // voa girando com estrelinhas
        ma.x += 2; ma.y += 9; ma.rot += 30;
        stars.push({ x: ma.x + (Math.random() * 30 - 15), y: ma.y + (Math.random() * 30 - 15), a: 1, s: 0.6 + Math.random() * 0.8, r: 0 });
        yield;
      }
      ma.show = false; yield* wait(0.4);
      startFinal(); return;
    }
    fase++; startPhase();
  });
}

function startFinal() {
  state = 'final'; song = 5; songStep = 0; SFX.win();
  cz.show = false; ma.show = false; dp.dance = false; dp.x = -190; dp.y = -60;
  run(function* () {
    yield* wait(1); dp.dance = true;
    cz.show = true; cz.x = 190; cz.y = -63; cz.size = 1; cz.say = 'Conseguimos, amigo!';
    yield* wait(2); cz.say = '';
  });
  run(function* () {
    yield* wait(2.5);
    clickables.push({ x: 0, y: -100, w: 300, h: 56, fn: () => { jogo2 = true; } });
    clickables.push({ x: 0, y: -150, w: 300, h: 56, fn: () => goTitle() });
  });
}

// ---------- Colisão (caixas) ----------
function dpBox() {
  const half = 20;
  let bottom = dp.y - 49, top = dp.y + 47;
  if (dp.cost === 'dead-power-3-abaixado') top = dp.y + 7;
  if (dp.cost === 'dead-power-2-pulando') bottom = dp.y - 40;
  return { l: dp.x - half, r: dp.x + half, b: bottom, t: top };
}
function objBox(o) {
  const w = iw(o.name) * 0.8, h = ih(o.name) * 0.85;
  return { l: o.x - w / 2, r: o.x + w / 2, b: o.y - h / 2, t: o.y + h / 2 };
}
const overlap = (a, b) => a.l < b.r && a.r > b.l && a.b < b.t && a.t > b.b;

// ---------- Atualização (30 vezes por segundo) ----------
function update() {
  frame++;
  const dt = 1 / FPS;
  musicTick(dt);
  if (showLogo > 0) showLogo -= dt;
  if (phaseBanner > 0) phaseBanner -= dt;

  // rotinas
  const current = routines; routines = [];
  const alive = current.filter(it => !it.next().done);
  routines = alive.concat(routines);   // mantém rotinas novas criadas durante esta rodada

  if (state === 'intro' && phaseBanner <= 0) state = 'play';

  const canControl = state === 'play' || state === 'intro';
  if (canControl) {
    // correr
    if (keys.right && dp.x < 120) dp.x += 5;
    if (keys.left && dp.x > -215) dp.x -= 5;
    // pular
    if (jumpPressed && dp.jumpF < 0) { dp.jumpF = 0; dp.cost = 'dead-power-2-pulando'; SFX.jump(); }
    if (dp.jumpF >= 0) {
      dp.y += dp.jumpF < 14 ? 12 : -12; dp.jumpF++;
      if (dp.jumpF >= 28) { dp.jumpF = -1; dp.y = -60; dp.cost = 'dead-power-1-parado'; }
    } else {
      dp.cost = keys.down ? 'dead-power-3-abaixado' : 'dead-power-1-parado';
    }
  }
  jumpPressed = false;

  // Cinzento e Mão Afiada correndo (fases 4 e 5)
  if (state === 'play' || state === 'intro') {
    if (cz.show && fase >= 4) cz.bob = (Math.floor(frame / 5) % 2) * 4;
    if (ma.show) { ma.f = Math.floor(frame / 8) % 2; ma.y = -40 + (Math.floor(frame / 4) % 2) * 6; }
  } else cz.bob = 0;

  if (state === 'play') {
    timer += dt; clock += dt;
    if (timer >= 1) { timer -= 1; tempo++; }
    if (tempo >= PHASE_SECONDS) { endPhase(); return; }

    // obstáculo de baixo
    if (!ob.show) {
      ob.wait -= dt;
      if (ob.wait <= 0 && !fl.show) {
        const list = BY_PHASE[fase - 1];
        ob.name = list[Math.floor(Math.random() * list.length)];
        ob.y = TALL.includes(ob.name) ? -75 : -92; ob.x = 260; ob.t = 0; ob.dur = vel(); ob.show = true;
      }
    } else {
      const antes = ob.x;
      ob.t += dt; ob.x = 260 - 520 * Math.min(1, ob.t / ob.dur);
      if (antes > dp.x && ob.x <= dp.x) ob.passedAt = clock;   // hora em que passou pelo ninja
      if (ob.t >= ob.dur) { ob.show = false; ob.wait = Math.max(rnd(M().espera), 1.05 - ob.dur); }   // nunca fica impossível
    }
    // obstáculo voador (nunca junto com o de baixo perto do ninja)
    if (!fl.show) {
      fl.wait -= dt;
      const flDur = vel() + 0.8 / M().veloc;
      const chegada = clock + (260 - dp.x) * flDur / 520;          // quando o voador chegaria no ninja
      if (fl.wait <= 0 && !hp.show && (!ob.show || ob.x < dp.x - 40) && chegada - (ob.passedAt || -9) >= 1.4) {
        fl.name = FLYERS[Math.floor(Math.random() * 2)]; fl.x = 260; fl.t = 0; fl.dur = vel() + 0.8 / M().veloc; fl.show = true;
      }
    } else {
      fl.t += dt; fl.x = 260 - 520 * Math.min(1, fl.t / fl.dur);
      if (fl.t >= fl.dur) { fl.show = false; fl.wait = rnd(M().voador); }
    }

    // coração de vida: aparece uma vez por fase, no chão ou no alto
    if (hp.left > 0 && !hp.show && tempo >= hp.at && !fl.show && (!ob.show || ob.x < dp.x - 40)) {
      ob.wait = Math.max(ob.wait, 1.2);   // dá um tempinho sem obstáculo para pegar o coração
      hp.left--; hp.at = tempo + 6 + Math.random() * 3; hp.show = true; hp.x = 260; hp.t = 0; hp.dur = vel();
      hp.y = Math.random() < 0.5 ? -85 : 35;
    }
    if (hp.show) {
      const hAntes = hp.x;
      hp.t += dt; hp.x = 260 - 520 * Math.min(1, hp.t / hp.dur);
      if (hAntes > dp.x && hp.x <= dp.x) ob.passedAt = clock;   // o coração também conta para o tempo de segurança
      if (hp.t >= hp.dur) hp.show = false;
      const hb = { l: hp.x - 13, r: hp.x + 13, b: hp.y - 12, t: hp.y + 12 };
      if (overlap(dpBox(), hb)) {
        hp.show = false; SFX.life(); ob.passedAt = clock;
        if (vidas < M().vidas) vidas++;
        hp.pop = 1; hp.popX = hp.x; hp.popY = hp.y;
      }
    }
    if (hp.pop > 0) { hp.pop -= dt; hp.popY += 1.5; }

    // batidas
    if (dp.blink > 0) dp.blink -= dt;
    else {
      const b = dpBox();
      if ((ob.show && overlap(b, objBox(ob))) || (fl.show && overlap(b, objBox(fl)))) hit();
    }
  }

  // estrelinhas e confete
  for (const s of stars) { s.a -= 0.08; s.r += 15; }
  stars = stars.filter(s => s.a > 0);
  if (state === 'final' && frame % 2 === 0) {
    const cols = ['confete-amarelo', 'confete-azul', 'confete-verde', 'confete-vermelho'];
    confetti.push({ x: Math.random() * 460 - 230, y: 185, n: cols[Math.floor(Math.random() * 4)], r: Math.random() * 360 });
  }
  for (const c of confetti) { c.y -= 4; c.x += Math.random() * 4 - 2; c.r += 12; }
  confetti = confetti.filter(c => c.y > -190);
  if (state === 'final' && dp.dance && frame % 8 === 0)
    dp.cost = dp.cost === 'dead-power-1-parado' ? 'dead-power-2-pulando' : 'dead-power-1-parado';
  if (state === 'final' && dp.dance) cz.bob = (Math.floor(frame / 3) % 2) * 15;
}

// ---------- Desenho ----------
function render() {
  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  ctx.clearRect(0, 0, W, H);
  const bg = state === 'title' ? '1-escola' : state === 'final' ? '6-festa' : ['1-escola', '2-patio', '3-telhados', '4-trem', '5-museu'][fase - 1];
  draw(bg, 0, 0);
  if (state !== 'title' && state !== 'final' && fase === 5) { ctx.fillStyle = 'rgba(0,0,0,0.25)'; ctx.fillRect(0, 0, W, H); }

  if (state === 'title') {
    draw('dead-power-1-parado', -170, -60);
    draw('cinzento', 170, -63);
    draw('titulo-ninja-em-acao', 0, 70, { size: 1.1 });
    const a = 0.6 + 0.4 * Math.sin(frame / 6);
    if (loaded < files.length) text('Carregando...', 0, -10, 24, '#fff', { stroke: '#1a2438', strokeW: 5 });
    else {
      text('Escolha o modo:', 0, 12, 18, `rgba(255,255,255,${a})`, { stroke: '#1a2438', strokeW: 5 });
      MODES.forEach((md, i) => {
        const x = -130 + i * 130, sel = i === modo;
        roundRect(x, -30, sel ? 122 : 112, sel ? 50 : 44, 12, md.cor, sel ? '#fff' : '#1a2438');
        text(md.nome.toUpperCase(), x, -30, sel ? 19 : 17, '#fff', { stroke: '#1a2438', strokeW: 4 });
      });
      const d = ['3 vidas • rápido', '3 vidas • muito rápido', '2 vidas • super rápido!'][modo];
      text(d, 0, -72, 13, '#fff', { stroke: '#1a2438', strokeW: 4, weight: 700 });
    }
    text('Pular: espaço ou PULAR • Abaixar: ▼ • Correr: ◀ ▶', 0, -160, 12, '#fff', { stroke: '#1a2438', strokeW: 4, weight: 700 });
    return;
  }

  if (state === 'final') draw('tela-parabens', 0, 0);

  if (ma.show) draw('mao-afiada-' + (ma.f + 1), ma.x, ma.y, { rot: ma.rot });
  if (cz.show) draw('cinzento', cz.x, cz.y + cz.bob, { size: Math.max(0.05, cz.size) });
  if (ob.show) draw(ob.name, ob.x, ob.y);
  if (fl.show) draw(fl.name, fl.x, fl.y + Math.sin(frame / 3) * 2);
  if (hp.show) {
    const by = hp.y + Math.sin(frame / 4) * 4;
    ctx.save(); ctx.globalAlpha = 0.35 + 0.2 * Math.sin(frame / 3); ctx.fillStyle = '#fff2a8';
    ctx.beginPath(); ctx.arc(240 + hp.x, 180 - by, 20, 0, Math.PI * 2); ctx.fill(); ctx.restore();
    draw('coracao-vida', hp.x, by);
  }
  if (hp.pop > 0) text('+1 ❤', hp.popX, hp.popY + 20, 16, `rgba(255,80,80,${Math.min(1, hp.pop * 2)})`, { stroke: '#fff', strokeW: 3 });

  const blinkHidden = dp.blink > 0 && Math.floor(dp.blink * 10) % 2 === 0;
  draw(dp.cost, dp.x, dp.y, { alpha: blinkHidden ? 0.25 : 1 });

  if (bomb.show) draw(bomb.name, bomb.x, bomb.y, { size: bomb.size });
  for (const s of stars) draw('estrelinha', s.x, s.y, { alpha: Math.max(0, s.a), size: s.s, rot: s.r });
  for (const c of confetti) draw(c.n, c.x, c.y, { rot: c.r });

  if (cz.show && cz.say) bubble(cz.say, cz.x, cz.y + 70 + cz.bob);

  // painel: fase, tempo e corações
  if (state !== 'final') {
    roundRect(-160, 162, 152, 26, 10, 'rgba(10,14,34,0.75)');
    text(`Fase ${fase}`, -228, 162, 14, '#ffd34a', { align: 'left' });
    text(M().nome, -160, 162, 11, M().cor, { weight: 800 });
    const left = Math.max(0, PHASE_SECONDS - tempo);
    text(`⏱ ${left}s`, -92, 162, 14, '#fff', { align: 'right' });
    for (let i = 0; i < vidas; i++) draw('coracao-vida', 220 - i * 30, 160);
  }
  if (phaseBanner > 0 && state !== 'final') draw('nome-fase-' + fase, 0, 110);
  if (showLogo > 0) draw('titulo-ninja-em-acao', 0, 30);

  if (state === 'gameover') {
    draw('tela-game-over', 0, 0);
    draw('botao-jogar-de-novo', 0, -70);
  }
  if (state === 'final' && clickables.length) {
    draw('botao-sim-ir-pro-jogo-2', 0, -100);
    draw('botao-nao-jogar-de-novo', 0, -150);
  }
  if (jogo2) { roundRect(0, 135, 300, 50, 14, 'rgba(41,128,185,0.95)', '#fff'); text('Jogo 2 em breve!', 0, 135, 26, '#fff'); }
}

// ---------- Laço principal ----------
let acc = 0, last = performance.now();
function loop(now) {
  acc += Math.min(0.25, (now - last) / 1000); last = now;
  while (acc >= 1 / FPS) { if (state !== 'title') update(); else frame++; acc -= 1 / FPS; }
  render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
document.addEventListener('visibilitychange', () => { if (document.hidden && AC) AC.suspend(); else if (AC && !muted) AC.resume(); });

// ganchos para testes automáticos
window.__ninja = { get state() { return state; }, get fase() { return fase; }, get vidas() { return vidas; }, get tempo() { return tempo; }, get modo() { return modo; },
  clickables, dp, ob, fl, hp, keys, press: k => { if (k === 'jump') jumpPressed = true; }, start: startGame, setVidas: v => { vidas = v; }, dpBox, objBox };
})();

</script>
<script>
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  }
</script>
